name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve app version
        id: version
        run: |
          prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          suffix=$(grep -oP '(?<=<VersionSuffix>)[^<]+' Directory.Build.props)
          version="$prefix-$suffix"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained (${{ matrix.rid }})
        run: |
          dotnet publish src/FMLab.QuickNote.App/FMLab.QuickNote.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output "dist/${{ matrix.rid }}"

      - name: Zip package
        run: |
          cd "dist/${{ matrix.rid }}"
          zip -r "../../FMLab.QuickNote-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: FMLab.QuickNote-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: FMLab.QuickNote-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
          retention-days: 30

  installer:
    name: Windows installer
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          suffix=$(grep -oP '(?<=<VersionSuffix>)[^<]+' Directory.Build.props)
          version="$prefix-$suffix"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: FMLab.QuickNote-${{ steps.version.outputs.version }}-win-x64
          path: dist-download

      - name: Extract published package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/win-x64 | Out-Null
          Expand-Archive -Path "dist-download/FMLab.QuickNote-${{ steps.version.outputs.version }}-win-x64.zip" -DestinationPath dist/win-x64 -Force

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows/FMLab.QuickNote.iss
          options: /DMyAppVersion="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FMLab.QuickNote-${{ steps.version.outputs.version }}-win-x64-Setup
          path: dist-installer/*.exe
          retention-days: 30

  release:
    name: Publish release
    needs: [package, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        run: |
          prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          suffix=$(grep -oP '(?<=<VersionSuffix>)[^<]+' Directory.Build.props)
          version="$prefix-$suffix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: FMLab.QuickNote-${{ steps.version.outputs.version }}-*
          path: dist-artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist-artifacts/*.zip dist-artifacts/*.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" dist-artifacts/*.zip dist-artifacts/*.exe \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes "Build automático a partir do commit ${{ github.sha }}." \
              --prerelease
          fi
